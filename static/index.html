<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Call Analysis Results</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Call Analysis</h1>
            <p>Upload a call recording to analyse sentiment, tone, and paralinguistic features per speaker.</p>
        </header>
        <section id="upload-area">
            <input type="file" id="file-input" accept="audio/*">
            <div id="drop-zone">Drop audio file here or click to browse</div>
            <div id="status"></div>
        </section>
        <section id="results"></section>
    </div>
    <script src="app.js"></script>
</body>
</html>
